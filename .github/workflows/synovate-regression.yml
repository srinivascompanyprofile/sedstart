name: Synovate-Regression

on:
  workflow_dispatch:

jobs:
  sedstart-run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SedStart test run
        uses: sedstart/runcloud@v1
        with:
          api_key: ${{ secrets.SEDSTART_API_KEY_SYNOVATE }}
          project_id: 1295
          suite_id: 1094
          profile_id: 2301
          browser: chrome
          headless: true
